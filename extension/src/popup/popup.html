<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Next Ep. Lock</title>
    <style>
      :root {
        color-scheme: dark;
        --color-void: oklch(0.14 0.05 300);
        --color-void-deep: oklch(0.09 0.035 300);
        --color-magenta: oklch(0.66 0.24 354);
        --color-violet: oklch(0.58 0.21 288);
        --color-teal: oklch(0.8 0.13 195);
        --color-glow: oklch(0.96 0.015 300);
        --color-haze: oklch(0.72 0.03 300);
        --color-dim: oklch(0.55 0.03 300);
      }

      * {
        box-sizing: border-box;
      }

      body {
        width: 300px;
        margin: 0;
        padding: 16px;
        background: var(--color-void);
        background-image: linear-gradient(180deg, transparent, var(--color-void-deep) 85%);
        color: var(--color-glow);
        font-family: Arial, Helvetica, sans-serif;
        font-size: 13px;
      }

      .brand {
        font-family: "Courier New", monospace;
        font-size: 11px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        margin: 0 0 14px;
      }

      .brand .accent {
        color: var(--color-magenta);
      }

      .card {
        border-radius: 14px;
        border: 1px solid oklch(1 0 0 / 0.1);
        background: oklch(0.22 0.055 300 / 0.55);
        padding: 12px 14px;
        margin-bottom: 12px;
      }

      .eyebrow {
        font-family: "Courier New", monospace;
        font-size: 9px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--color-haze);
        margin: 0 0 6px;
      }

      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }

      .row + .row {
        margin-top: 8px;
      }

      .switch {
        position: relative;
        width: 34px;
        height: 19px;
        border-radius: 999px;
        border: none;
        background: oklch(0.32 0.02 280);
        cursor: pointer;
        padding: 0;
        flex-shrink: 0;
      }

      .switch[data-on="true"] {
        background-image: linear-gradient(135deg, var(--color-magenta), var(--color-violet));
      }

      .switch .knob {
        position: absolute;
        top: 2.5px;
        left: 2.5px;
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: oklch(0.96 0.015 300);
        transition: left 0.15s ease;
      }

      .switch[data-on="true"] .knob {
        left: 17.5px;
      }

      button.pill {
        display: block;
        width: 100%;
        border: none;
        border-radius: 999px;
        padding: 9px 14px;
        font-size: 13px;
        font-weight: 700;
        cursor: pointer;
        color: oklch(0.99 0 0);
        background-image: linear-gradient(135deg, var(--color-magenta), var(--color-violet));
      }

      button.pill:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      button.pill-ghost {
        background-image: none;
        background-color: oklch(1 0 0 / 0.07);
        border: 1px solid oklch(1 0 0 / 0.14);
        color: var(--color-glow);
        margin-top: 8px;
      }

      .segments {
        display: flex;
        gap: 4px;
        margin: 8px 0 6px;
      }

      .segment {
        flex: 1;
        border-radius: 9px;
        border: 1px solid oklch(1 0 0 / 0.12);
        background: oklch(1 0 0 / 0.03);
        color: var(--color-haze);
        font-family: Arial, Helvetica, sans-serif;
        font-size: 13px;
        font-weight: 700;
        padding: 7px 0;
        cursor: pointer;
      }

      .segment[aria-pressed="true"] {
        border-color: oklch(0.66 0.24 354 / 0.55);
        background-image: linear-gradient(
          135deg,
          oklch(0.66 0.24 354 / 0.3),
          oklch(0.58 0.21 288 / 0.3)
        );
        color: var(--color-glow);
      }

      .segment:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }

      .status-text.error {
        color: var(--color-magenta);
      }

      .bar {
        display: flex;
        gap: 4px;
        margin: 8px 0;
      }

      .bar span {
        height: 8px;
        flex: 1;
        border-radius: 999px;
        background: oklch(1 0 0 / 0.1);
      }

      .bar span[data-filled="true"] {
        background-image: linear-gradient(135deg, var(--color-magenta), var(--color-violet));
      }

      .status-text {
        color: var(--color-haze);
        font-size: 12px;
        margin: 0;
      }

      a {
        color: var(--color-violet);
        text-decoration: none;
      }

      a:hover {
        text-decoration: underline;
      }

      .footer {
        text-align: center;
        margin-top: 4px;
      }

      .footer a {
        font-size: 11px;
        color: var(--color-dim);
      }
    </style>
  </head>
  <body>
    <p class="brand">Next<span class="accent">.</span>Ep<span class="accent">.</span>Lock</p>

    <div id="token-warning" class="card" hidden>
      <p class="eyebrow">Not connected</p>
      <p class="status-text">
        No API token saved. <a href="#" id="open-options">Open Options</a> to connect your
        account.
      </p>
    </div>

    <div class="card">
      <div class="row">
        <p class="eyebrow" style="margin: 0">Auto-detect (flixcloud.cc)</p>
        <button id="auto-detect-toggle" class="switch" data-on="false" aria-pressed="false">
          <span class="knob"></span>
        </button>
      </div>
      <p class="status-text" style="margin-top: 6px">
        Experimental — attempts to catch the episode ending on its own. The button below always
        works regardless.
      </p>
    </div>

    <div class="card">
      <p class="eyebrow">Jobs per episode</p>
      <div id="episode-segments" class="segments" role="group" aria-label="Jobs per episode">
        <button type="button" class="segment" data-count="1" aria-pressed="false">1</button>
        <button type="button" class="segment" data-count="2" aria-pressed="false">2</button>
        <button type="button" class="segment" data-count="3" aria-pressed="false">3</button>
        <button type="button" class="segment" data-count="4" aria-pressed="false">4</button>
        <button type="button" class="segment" data-count="5" aria-pressed="false">5</button>
      </div>
      <p id="episode-label" class="status-text">Loading…</p>
    </div>

    <div id="session-card" class="card" hidden>
      <p class="eyebrow">Active lock</p>
      <p id="session-progress" class="status-text"></p>
      <div id="session-bar" class="bar"></div>
      <button id="snooze-button" class="pill pill-ghost" type="button">Snooze</button>
    </div>

    <button id="trigger-button" class="pill" type="button">I finished an episode</button>
    <p id="trigger-status" class="status-text" style="margin-top: 8px"></p>

    <div class="footer">
      <a href="#" id="open-options-footer">Options</a>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
